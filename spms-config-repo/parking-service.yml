server:
  port: 8082

spring:
  application:
    name: parking-service
  datasource:
    url: jdbc:postgresql://localhost:5432/spms_parking
    username: spms_admin
    password: spms_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
    redis:
      time-to-live: 60000
      cache-null-values: false
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# JWT Verification for Parking Service (Zero Trust ADR-007)
jwt:
  public-key-path: classpath:spms-jwt-public.pem
  issuer: spms-user-service

# Messaging
spms:
  rabbitmq:
    exchange: spms.events
